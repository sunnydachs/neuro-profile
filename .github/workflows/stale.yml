name: Mark and close stale issues/PRs

on:
  schedule:
    - cron: '0 0 * * 0'  # weekly
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11.0.0
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security,dependencies'
          operations: 'close,label'
          # dependabot PRs are exempt via 'dependencies' label auto-applied
