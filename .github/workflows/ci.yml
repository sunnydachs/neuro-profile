name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Only lines that still receive security patches. Node 18 (EOL
        # 2025-04-30) and 20 (EOL 2026-04-30) used to be listed here.
        # scripts/check_runtimes.py fails the build if this list goes stale.
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Check the matrix versions are still supported
      run: python3 scripts/check_runtimes.py
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test
    - name: Generate coverage (Node 22.x only)
      if: matrix.node-version == '22.x'
      run: npx --yes c8 --reporter=text-lcov --reporter=text npm test
    - name: Upload coverage to Codecov (Node 22.x only)
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v7.1.1
      with:
        files: ./coverage/lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
